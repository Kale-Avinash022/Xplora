<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134e4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" />
  <circle cx="16" cy="16" r="15" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.6" />

  <!-- Compass ring -->
  <circle cx="16" cy="13" r="6.5" fill="none" stroke="#f59e0b" stroke-width="1" />
  <circle cx="16" cy="13" r="1.5" fill="#f59e0b" />

  <!-- Compass needles -->
  <line x1="16" y1="6.8" x2="16" y2="11" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" />
  <line x1="16" y1="15" x2="16" y2="19.2" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
  <line x1="9.8" y1="13" x2="14" y2="13" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
  <line x1="18" y1="13" x2="22.2" y2="13" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

  <!-- North arrow tip -->
  <polygon points="16,6 14.8,9.5 16,8.5 17.2,9.5" fill="#f97316" />

  <!-- Ocean waves -->
  <path d="M5 22 Q8 19 11 22 Q14 25 17 22 Q20 19 23 22 Q25 20.5 27 22"
        fill="none" stroke="url(#wave)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M7 26 Q10 23.5 13 26 Q16 28.5 19 26 Q21.5 24.5 24 26"
        fill="none" stroke="#0ea5e9" stroke-width="1" stroke-linecap="round" opacity="0.5" />
</svg>
